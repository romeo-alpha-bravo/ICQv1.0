# ICQ1.0 – full stack: nginx + php-fpm + MariaDB + Mailpit.
# Start:  cp .env.example .env  (or: make env)  then  docker compose up -d --build
# Site:   http://localhost:8080      Mail inbox: http://localhost:8025

name: icq1

services:
  # Public entry point. Serves static files itself and passes *.php to php-fpm.
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"     # only this computer can reach the site
    volumes:
      - ./:/var/www/html:ro                  # code, read-only for nginx
      - uploads:/var/www/html/uploads:ro     # profile photos written by php
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/login.php"]
      interval: 30s
      timeout: 5s
      retries: 3

  # PHP application server (FastCGI on port 9000, internal network only).
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: uin_mail
      DB_USER: ${DB_USER:-uin_app}
      DB_PASS: ${DB_PASS:?Set DB_PASS in .env}
      UIN_ENC_KEY: ${UIN_ENC_KEY:?Set UIN_ENC_KEY in .env}
      UIN_HMAC_KEY: ${UIN_HMAC_KEY:?Set UIN_HMAC_KEY in .env}
      UIN_TIMEZONE: ${APP_TIMEZONE:-Europe/Prague}
      UIN_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      UIN_UPLOAD_DIR: /var/www/html/uploads
      UIN_MAIL_MODE: smtp
      UIN_MAIL_HOST: mailpit
      UIN_MAIL_PORT: "1025"
      UIN_MAIL_FROM: ${MAIL_FROM:-no-reply@icq1.local}
    volumes:
      - ./:/var/www/html                     # code (bind mount: edits apply without rebuild)
      - uploads:/var/www/html/uploads        # photos survive container rebuilds
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Database. Not published to the host at all; only php can reach it.
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:?Set DB_ROOT_PASS in .env}
      MARIADB_DATABASE: uin_mail
      MARIADB_USER: ${DB_USER:-uin_app}
      MARIADB_PASSWORD: ${DB_PASS:?Set DB_PASS in .env}
    volumes:
      - dbdata:/var/lib/mysql
      # Run once, on the very first start (empty volume), in name order:
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docker/db/02-least-privilege.sh:/docker-entrypoint-initdb.d/02-least-privilege.sh:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Local mail catcher: receives password-reset mails, delivers nothing outside.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAIL_UI_PORT:-8025}:8025"   # web inbox

volumes:
  dbdata:
  uploads:
