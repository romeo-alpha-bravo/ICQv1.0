# ICQ1.0 – nginx in front of php-fpm
server {
    listen 80;
    server_name _;

    root  /var/www/html;
    index index.php;

    server_tokens off;            # no nginx version in headers and error pages
    client_max_body_size 12m;     # matches post_max_size in php.ini

    # ---- Never served: hidden files, internals, sources, docs ----
    location ~ /\.                                  { return 404; }   # .git, .env, .htaccess
    location ~ ^/(includes|docker|docs)/            { return 404; }
    location ~ \.(sql|md|yml|yaml|ini|conf|sh|lock|dist)$ { return 404; }
    location = /config.php                          { return 404; }
    location = /install_admin.php                   { return 404; }   # command line only
    location ~ \.local\.php$                        { return 404; }

    # ---- Static files ----
    location ^~ /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }

    # Photos are data, never code: nothing in /uploads/ reaches PHP.
    location ^~ /uploads/ {
        try_files $uri =404;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }

    # ---- Pages ----
    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files $uri =404;      # unknown scripts get 404 and never reach php-fpm
        fastcgi_pass  php:9000;
        fastcgi_index index.php;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 30s;
    }
}
