; ICQ1.0 overrides for the default php-fpm pool
[www]
; Keep the container's environment variables (DB_*, UIN_*) visible to PHP
clear_env = no

; Liveness endpoint for the health check (answers "pong"; not reachable through nginx)
ping.path = /ping

; Small fixed pool: enough for a course project, bounded memory use
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
