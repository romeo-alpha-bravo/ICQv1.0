; ICQ1.0 PHP settings (container)

; Photos up to 10 MB (the form adds a little on top)
upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 256M

; Errors go to the container log (docker compose logs php), never to the browser
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Do not announce the PHP version in response headers
expose_php = Off

; The app converts times itself; keep PHP neutral
date.timezone = UTC

; Opcode cache: compiled scripts stay in memory
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
